<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cat Escape</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff2c9;color:#33261d;font-family:Cairo,system-ui}.wrap{width:min(100vw,1100px);padding:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}h1{margin:0;font-weight:900;font-size:clamp(26px,5vw,48px);color:#4a3728}.tag{font-size:12px;border:2px solid #d9a24a;border-radius:20px;padding:5px 12px;background:#fff8df}.game{position:relative;overflow:hidden;border:4px solid #4b392c;border-radius:18px;box-shadow:0 12px 0 #c48742;background:#8fd6f4}canvas{width:100%;aspect-ratio:16/7;display:block;outline:0;cursor:pointer}.hud{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:space-between;padding:15px;pointer-events:none;direction:ltr;font-weight:900;color:#443225;text-shadow:0 1px #fff}.seed{direction:rtl;background:#fff7d4cc;border-radius:10px;padding:4px 10px}.help{margin-top:13px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#70523b}.keys{direction:ltr;display:flex;gap:6px;align-items:center}kbd{font-family:inherit;font-weight:900;color:white;background:#503c2f;border-radius:5px;border-bottom:3px solid #251b15;padding:2px 7px}.popup{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:clamp(22px,4vw,43px);font-weight:900;background:#fff3d2e8;text-shadow:0 2px #fff;z-index:3}.popup.hide{display:none}.popup small{display:block;font-size:15px;margin-top:8px;font-weight:800}.menu{max-width:820px;padding:12px}.menu h2{margin:0 0 8px;font-size:clamp(26px,5vw,46px)}.wallet{font-size:16px;color:#8b5723}.menu button{font:inherit;font-weight:900;background:#563e2d;color:#fff;border:0;border-radius:11px;padding:10px 22px;cursor:pointer;box-shadow:0 3px #2b1d15}.menu button:disabled{background:#a99987;box-shadow:none}.menu-actions{display:flex;direction:rtl;justify-content:center;gap:15px;margin:22px 0}.menu-actions button{min-width:160px;font-size:20px;padding:13px 20px}.birds{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}.bird-card{width:175px;padding:11px 8px;border:2px solid #c79248;border-radius:12px;background:#fff9df;font-size:15px}.bird-card strong{display:block;font-size:22px}.bird-card button{font-size:13px;padding:6px 12px;margin-top:6px}.skin-art{width:112px;height:72px;margin:0 auto 5px;filter:drop-shadow(0 3px 1px #b99a66)}.picked{border-color:#55a34d;background:#ebffe3}.coin{color:#98611f;font-size:12px}@media(max-width:620px){.tag,.help>span{display:none}.help{justify-content:center}.bird-card{width:145px}.birds{gap:5px}.menu-actions button{min-width:125px}}
</style></head><body><main class="wrap"><div class="head"><h1>هروب العصفور</h1><span class="tag">لا تدع البسة تمسكك!</span></div><section class="game"><canvas id="c" width="1200" height="525" tabindex="0"></canvas><div class="hud"><span id="score">00000</span><span id="boost" class="seed">فصفص: 0 / 5</span></div><div id="popup" class="popup">اضغط للبدء<small>Space للقفز • Q للطيران عند جمع الفصفص</small></div></section><div class="help"><span>اقفز فوق الصخور والأغصان، واجمع أكل العصافير لتطير بسرعة بعيدًا عن البسة.</span><div class="keys"><kbd>Space</kbd> قفز <kbd>Q</kbd> طيران سريع</div></div></main>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),W=c.width,H=c.height,ground=405,pop=document.querySelector('#popup'),scoreEl=document.querySelector('#score'),boostEl=document.querySelector('#boost');
let run=false,dead=false,last=0,dist=0,speed=8,bird,obs,seeds,clouds,flash=0,lastObstacle=-999,nextSpawn=140,timeAlive=0,safeLanding=0;
const kinds={basic:{name:'العصفور العادي',price:0,color:'#e7a928'},rose:{name:'عصفور الروز',price:200,color:'#63a85b'},cockatiel:{name:'عصفور الكروان',price:500,color:'#8b8c85'},conure:{name:'عصفور الكنيور الأخضر',price:5000,color:'#4c9859'}};
let wallet=Number(localStorage.getItem('birdSeeds')||0),owned=JSON.parse(localStorage.getItem('birdOwned')||'["basic"]'),selected=localStorage.getItem('birdSelected')||'basic';
function save(){localStorage.setItem('birdSeeds',wallet);localStorage.setItem('birdOwned',JSON.stringify(owned));localStorage.setItem('birdSelected',selected)}
function skinArt(id){let d={basic:['#e7a928','#f5c445','M17 42Q12 14 39 15Q59 16 60 37Q54 58 24 54Z','M25 34Q6 20 7 45Q19 55 36 45'],rose:['#63a85b','#f3a07e','M17 42Q12 14 39 15Q59 16 60 37Q54 58 24 54Z','M25 34Q6 20 7 45Q19 55 36 45'],cockatiel:['#8b8c85','#f2d15d','M17 43Q13 13 42 16Q61 20 58 43Q48 59 24 54Z','M34 17Q28 0 40 4L47 18'],conure:['#4c9859','#777d78','M17 42Q13 14 42 15Q61 20 58 43Q48 59 24 54Z','M31 24Q34 10 49 16L52 30']}[id];let face=id==='rose'?'<ellipse cx="47" cy="29" rx="12" ry="14" fill="#f3a07e"/>':id==='cockatiel'?'<circle cx="47" cy="34" r="8" fill="#e98d2e"/>':id==='conure'?'<path fill="#b54338" d="M22 44l-24 12 28-3z"/>':'';return `<svg class="skin-art" viewBox="0 0 80 70" aria-label="صورة ${kinds[id].name}"><path fill="${d[0]}" d="${d[2]}"/><path fill="${d[1]}" d="${d[3]}"/>${face}<circle cx="50" cy="26" r="4" fill="#21191a"/><path fill="#d9d0bd" d="M59 31l13 5-13 5z"/><path stroke="#543626" stroke-width="3" d="M30 54v9m11-9v9"/></svg>`}
function showMenu(page='home'){run=false;if(page==='home'){pop.innerHTML=`<div class="menu"><h2>هروب العصفور</h2><div class="wallet">رصيدك: 🌻 ${wallet} فصفص</div><div class="menu-actions"><button data-start="1">ابدأ اللعب</button><button data-store="1">العصافير</button></div><small>اجمع الفصفص أثناء اللعب لشراء عصافير جديدة.</small></div>`}else{let cards=Object.entries(kinds).map(([id,k])=>{let has=owned.includes(id),pick=selected===id;return `<div class="bird-card ${pick?'picked':''}">${skinArt(id)}<strong>${k.name}</strong><span class="coin">${k.price?'🌻 '+k.price+' فصفص':'مجاني'}</span><br><button data-bird="${id}" ${!has&&wallet<k.price?'disabled':''}>${has?(pick?'العصفور المختار':'مملوك — استخدمه'):'اشترِ العصفور'}</button></div>`}).join('');pop.innerHTML=`<div class="menu"><h2>العصافير</h2><div class="wallet">رصيدك: 🌻 ${wallet} فصفص</div><div class="birds">${cards}</div><button data-back="1">رجوع</button></div>`}pop.className='popup'}
pop.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.start){start();return}if(b.dataset.store){showMenu('store');return}if(b.dataset.back||b.dataset.home){showMenu();return}let id=b.dataset.bird,k=kinds[id];if(!owned.includes(id)){if(wallet<k.price)return;wallet-=k.price;owned.push(id)}selected=id;save();showMenu('store')});
function fmt(t){let s=Math.floor(t);return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function reset(){bird={x:225,y:ground-65,vy:0,fly:0,boost:0,wing:0};obs=[];seeds=[];clouds=Array.from({length:6},(_,i)=>({x:i*220+60,y:35+Math.random()*110,s:.5+Math.random()}));dist=0;speed=8;dead=false;flash=0;lastObstacle=-999;nextSpawn=140;timeAlive=0;safeLanding=0;scoreEl.textContent='⏱ 00:00';boostEl.textContent='فصفص: 0 / 5'}
function start(){reset();run=true;pop.className='popup hide';c.focus()}
function jump(){if(!run){return}if(dead){showMenu();return}if(bird.y>=ground-66&&bird.fly<=0)bird.vy=-17}
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump()}if(e.code==='KeyQ'&&run&&!dead&&bird.boost>=5&&bird.fly<=0){bird.boost=0;bird.fly=180;bird.vy=-5;boostEl.textContent='طيران: 3.0 ثوانٍ';e.preventDefault()}});c.onclick=jump;
function add(){let r=Math.random();if(r<.42&&dist-lastObstacle>390){obs.push({x:W+40,w:70,h:48+Math.random()*16,reach:0});lastObstacle=dist;nextSpawn=dist+420+Math.random()*150}else{seeds.push({x:W+20,y:235+Math.random()*115,kind:r<.86?'seed':'nut',spin:Math.random()*7});nextSpawn=dist+130+Math.random()*130}}
function collide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(dt){if(!run||dead)return;timeAlive+=dt;let fast=bird.fly>0,move=speed*(fast?2.25:1)*dt*60;dist+=move*.75;speed=Math.min(15,8+dist/1200);bird.wing+=dt*(fast?35:16);if(fast){bird.fly=Math.max(0,bird.fly-dt*60);bird.vy+=(-.38-bird.vy)*dt*3;bird.y+=bird.vy*dt*60;bird.y=Math.max(105,Math.min(310,bird.y));boostEl.textContent='طيران: '+(bird.fly/60).toFixed(1)+' ث';flash=.12;if(bird.fly===0){safeLanding=100;for(const q of obs)if(q.x>bird.x-80&&q.x<bird.x+300)q.x+=330}}else{bird.vy+=.9*dt*60;bird.y+=bird.vy*dt*60;if(bird.y>ground-65){bird.y=ground-65;bird.vy=0}if(bird.boost>=5)boostEl.textContent='جاهز للطيران! اضغط Q'}safeLanding=Math.max(0,safeLanding-dt*60);for(const q of clouds){q.x-=move*.12*q.s;if(q.x<-140)q.x=W+120}for(const q of obs){q.x-=move;let close=Math.abs(q.x-bird.x)<105&&bird.y<ground-115;q.reach+=((close?1:0)-q.reach)*dt*8}for(const q of seeds){q.x-=move;q.spin+=dt*8}obs=obs.filter(q=>q.x>-100);seeds=seeds.filter(q=>q.x>-40);if(dist>=nextSpawn)add();let b={x:bird.x-25,y:bird.y-20,w:75,h:58};for(const q of obs)if(!safeLanding&&collide(b,{x:q.x+8,y:ground-q.h-q.reach*34,w:q.w-16,h:q.h+q.reach*34})){dead=true;pop.innerHTML='<div class="menu"><h2>البسة عضّت العصفور!</h2><div class="wallet">لقد بقيت على قيد الحياة: ⏱ '+fmt(timeAlive)+'</div><div class="menu-actions"><button data-start="1">أعد اللعب</button><button data-home="1">القائمة الرئيسية</button></div><small>رصيدك محفوظ: 🌻 '+wallet+' فصفص</small></div>';pop.className='popup'}for(let i=seeds.length-1;i>=0;i--){let q=seeds[i];if(collide(b,{x:q.x-13,y:q.y-13,w:26,h:26})){let gain=q.kind==='nut'?2:1;bird.boost=Math.min(5,bird.boost+gain);wallet+=gain;save();seeds.splice(i,1);boostEl.textContent=bird.boost>=5?'جاهز للطيران! اضغط Q':'فصفص: '+bird.boost+' / 5'}}scoreEl.textContent='⏱ '+fmt(timeAlive)}
function birdDraw(){let y=bird.y,flap=Math.sin(bird.wing)*12,body=kinds[selected].color;x.save();x.translate(bird.x,y);if(bird.fly>0)x.rotate(-.13);if(selected==='conure'){x.fillStyle='#b64036';x.beginPath();x.moveTo(-27,8);x.lineTo(-72,27);x.lineTo(-27,24);x.fill()}x.fillStyle=body;x.beginPath();x.ellipse(0,0,39,29,0,0,7);x.fill();x.fillStyle=selected==='rose'?'#4c914c':selected==='conure'?'#3e824b':'#686a68';x.beginPath();x.ellipse(-12,flap*.28,24,13,-.45,0,7);x.fill();x.fillStyle=selected==='cockatiel'?'#f0d15d':selected==='rose'?'#f3a07e':selected==='conure'?'#777d78':'#f0d48a';x.beginPath();x.ellipse(18,-4,20,22,0,0,7);x.fill();if(selected==='cockatiel'){x.fillStyle='#f0d15d';x.beginPath();x.moveTo(7,-22);x.lineTo(10,-51);x.lineTo(18,-23);x.moveTo(15,-23);x.lineTo(29,-45);x.lineTo(25,-17);x.fill();x.fillStyle='#e9882d';x.beginPath();x.arc(24,1,8,0,7);x.fill()}if(selected==='rose'){x.fillStyle='#f3a07e';x.beginPath();x.ellipse(25,-4,13,16,0,0,7);x.fill()}if(selected==='conure'){x.fillStyle='#303c3b';x.beginPath();x.arc(18,-14,10,0,7);x.fill()}x.fillStyle='#d8d0bc';x.beginPath();x.moveTo(37,-5);x.lineTo(57,3);x.lineTo(37,10);x.fill();x.fillStyle='#231b18';x.beginPath();x.arc(22,-10,4.5,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(23,-11,1.3,0,7);x.fill();x.strokeStyle='#513321';x.lineWidth=3;x.beginPath();x.moveTo(-2,25);x.lineTo(-5,35);x.moveTo(13,25);x.lineTo(13,35);x.stroke();x.restore()}
function obstacle(q){let stretch=q.reach*58,base=ground-q.h;x.save();x.translate(q.x+q.w/2,ground-q.h/2-stretch/2);x.scale(1,1+stretch/q.h);x.fillStyle='#76616a';x.beginPath();x.ellipse(0,0,q.w*.46,q.h*.45,0,0,7);x.fill();x.beginPath();x.moveTo(-q.w*.38,-q.h*.18);x.lineTo(-q.w*.3,-q.h*.65);x.lineTo(-q.w*.07,-q.h*.26);x.moveTo(q.w*.04,-q.h*.27);x.lineTo(q.w*.3,-q.h*.65);x.lineTo(q.w*.38,-q.h*.12);x.fill();x.fillStyle='#f1d55c';for(const a of [-q.w*.17,q.w*.17]){x.beginPath();x.ellipse(a,-q.h*.14,7,10,0,0,7);x.fill();x.fillStyle='#1f1820';x.beginPath();x.arc(a,-q.h*.14,3,0,7);x.fill();x.fillStyle='#f1d55c'}x.fillStyle='#e68d9b';x.beginPath();x.arc(0,q.h*.1,6,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.ellipse(0,q.h*.28,q.w*.22,7,0,0,7);x.fill();x.fillStyle='#331d25';for(let a=-q.w*.13;a<q.w*.14;a+=q.w*.13){x.beginPath();x.moveTo(a,q.h*.21);x.lineTo(a+4,q.h*.34);x.lineTo(a+8,q.h*.21);x.fill()}x.restore()}
function render(){x.clearRect(0,0,W,H);let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#76cdec');sky.addColorStop(1,'#e9e7b9');x.fillStyle=sky;x.fillRect(0,0,W,H);for(const q of clouds){x.fillStyle='#ffffffb5';for(let i=0;i<3;i++){x.beginPath();x.arc(q.x+i*22*q.s,q.y+(i%2)*7,20*q.s,0,7);x.fill()}}x.fillStyle='#b6d16f';x.beginPath();x.moveTo(0,340);for(let i=0;i<W;i+=45)x.lineTo(i,325+Math.sin(i*.05)*17);x.lineTo(W,ground);x.lineTo(0,ground);x.fill();x.fillStyle='#dfc46c';x.fillRect(0,ground,W,H-ground);x.strokeStyle='#aa8a42';x.lineWidth=4;x.beginPath();x.moveTo(0,ground);x.lineTo(W,ground);x.stroke();for(const q of seeds){x.save();x.translate(q.x,q.y);x.rotate(q.spin);if(q.kind==='nut'){x.fillStyle='#9d5a27';x.beginPath();x.arc(0,0,13,0,7);x.fill();x.fillStyle='#e3a052';x.beginPath();x.arc(0,0,6,0,7);x.fill()}else{x.fillStyle='#f5e5a9';x.beginPath();x.ellipse(0,0,7,15,.4,0,7);x.fill();x.strokeStyle='#a27c39';x.lineWidth=1;x.beginPath();x.moveTo(0,-10);x.lineTo(0,10);x.stroke()}x.restore()}for(const q of obs)obstacle(q);birdDraw();if(bird.fly>0){x.strokeStyle='#fff1a2';x.lineWidth=4;for(let i=0;i<4;i++){x.beginPath();x.moveTo(bird.x-55-i*20,bird.y+i*8-12);x.lineTo(bird.x-100-i*23,bird.y+i*9-12);x.stroke()}}if(flash>0){flash-=.02;x.fillStyle='#fff8';x.fillRect(0,0,W,H)}}
function loop(t){let dt=Math.min(.035,(t-last||0)/1000);last=t;update(dt);render();requestAnimationFrame(loop)}reset();showMenu();render();requestAnimationFrame(loop);
</script></body></html>
